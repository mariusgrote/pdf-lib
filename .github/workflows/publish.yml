# Publishes @mariusgrote/pdf-lib via npm Trusted Publishing (OIDC).
# No NPM_TOKEN required — configure the Trusted Publisher on npmjs.com to:
#   Organization/user: mariusgrote
#   Repository:        pdf-lib
#   Workflow filename: publish.yml
#   Allowed actions:   include "npm publish" (direct publish)
#
# Docs: https://docs.npmjs.com/trusted-publishers

name: Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  id-token: write # required for OIDC → npm
  contents: read

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.4.1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          registry-url: 'https://registry.npmjs.org'
          # Never cache package manager state for release builds.
          package-manager-cache: false

      # Trusted Publishing (OIDC) is done by the npm CLI, so publishing uses
      # npm. Everything else uses pnpm.
      - name: Use npm with OIDC support
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Load the built package in Node
        run: pnpm test:smoke

      - name: Publish @mariusgrote/pdf-lib
        # Do NOT set NODE_AUTH_TOKEN here — that would bypass OIDC.
        # Provenance attestations are generated automatically with Trusted Publishing.
        run: npm publish --access public
