name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test, build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24', '26']
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.4.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Format, lint and tests run in the background while the build chain
      # runs in the foreground. None of them read the build output.
      - name: Check formatting
        id: fmt
        background: true
        run: pnpm fmt:check

      - name: Lint and typecheck
        id: lint
        background: true
        run: pnpm lint --format github

      - name: Test
        id: test
        background: true
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Compile the Node apps against the built type declarations
        run: pnpm apps:build

      - name: Load the built package in Node
        run: pnpm test:smoke

      - name: Wait for format, lint and tests
        wait: [fmt, lint, test]
