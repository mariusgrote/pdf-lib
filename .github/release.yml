# Categories for GitHub's generated release notes
# (`gh release create --generate-notes`). Pull requests are sorted by label.
changelog:
  exclude:
    labels:
      - skip-release-notes
  categories:
    - title: Breaking changes
      labels:
        - breaking
    - title: New features
      labels:
        - enhancement
    - title: Bug fixes
      labels:
        - bug
    - title: Documentation
      labels:
        - documentation
    - title: Tooling and CI
      labels:
        - tooling
    - title: Dependencies
      labels:
        - dependencies
    - title: Other changes
      labels:
        - '*'
